name: multx-disabled-staging

services:
  database:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: multx_mainnet_staging
      POSTGRES_USER: multx_staging_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db-owner-password
    secrets:
      - db-owner-password
      - db-app-password
    volumes:
      - multx-disabled-staging-db:/var/lib/postgresql/data
      - ./init-disabled-staging-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
      - ./verify-disabled-staging-db.sql:/run/ops/verify-disabled-staging-db.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multx_staging_owner -d multx_mainnet_staging"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  migrator:
    build:
      context: ../api
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    command: ["node", "src/migrate-entrypoint.mjs"]
    environment:
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: multx_staging_owner
      DB_NAME: multx_mainnet_staging
      DB_PASSWORD_FILE: /run/secrets/db-owner-password
    secrets:
      - db-owner-password
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../api
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      MULTX_ENABLED: "false"
      DB_MIGRATIONS_ENABLED: "false"
      PORT: "4000"
      CORS_ORIGINS: https://disabled.invalid
      TRUST_PROXY_HOPS: "1"
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: multx_staging_app
      DB_NAME: multx_mainnet_staging
      DB_PASSWORD_FILE: /run/secrets/db-app-password
      MOCK_VALIDATOR: "false"
      SIGNATURES_REQUIRED: "3"
    secrets:
      - db-app-password
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>r.json()).then(v=>{if(v.multx!=='disabled')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  backend:
    internal: true

volumes:
  multx-disabled-staging-db:

secrets:
  db-owner-password:
    file: ${MULTX_DISABLED_DB_OWNER_PASSWORD_FILE:?set MULTX_DISABLED_DB_OWNER_PASSWORD_FILE}
  db-app-password:
    file: ${MULTX_DISABLED_DB_APP_PASSWORD_FILE:?set MULTX_DISABLED_DB_APP_PASSWORD_FILE}
