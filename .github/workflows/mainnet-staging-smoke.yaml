name: Lithoscan Mainnet Staging Smoke
run-name: Staging smoke ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact full commit SHA to build and smoke-test
        required: true
        type: string
      max_indexer_lag:
        description: Maximum acceptable indexer lag in blocks
        required: true
        default: '20'
        type: string

concurrency:
  group: lithoscan-mainnet-staging-smoke
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: lithoscan-staging
    env:
      DEPLOY_COMMIT_SHA: ${{ inputs.commit_sha }}
      MAX_INDEXER_LAG: ${{ inputs.max_indexer_lag }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
      RPC_URL: https://rpc-mainnet.litho.ai
      EVM_RPC_URL: https://rpc-mainnet.litho.ai
      EVM_WS_URL: wss://rpc-mainnet.litho.ai/websocket
      LITHO_LCD_URL: https://api-mainnet.litho.ai
      GRPC_URL: grpc-mainnet.litho.ai:9090
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact release and protected values
        shell: bash
        run: |
          [[ "$DEPLOY_COMMIT_SHA" =~ ^[0-9a-f]{40}$ && "$DEPLOY_COMMIT_SHA" == "$GITHUB_SHA" ]] || {
            echo "Dispatch from the exact full commit being tested"; exit 1;
          }
          [[ "$MAX_INDEXER_LAG" =~ ^[0-9]+$ ]] || { echo "max_indexer_lag must be a non-negative integer"; exit 1; }
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY POSTGRES_PASSWORD REDIS_PASSWORD GHCR_USER GHCR_TOKEN; do
            [[ -n "${!name:-}" ]] || { echo "Missing protected value: $name"; exit 1; }
          done
          [[ "$POSTGRES_PASSWORD" =~ ^[A-Za-z0-9._~-]{32,}$ ]] || { echo "POSTGRES_PASSWORD is invalid"; exit 1; }
          [[ "$REDIS_PASSWORD" =~ ^[A-Za-z0-9._~-]{32,}$ ]] || { echo "REDIS_PASSWORD is invalid"; exit 1; }

      - name: Configure direct staging SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate live mainnet identity from the deployment VPS
        shell: bash
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "REQUIRE_GENESIS=false RPC_URL='$RPC_URL' EVM_RPC_URL='$EVM_RPC_URL' EVM_WS_URL='$EVM_WS_URL' LITHO_LCD_URL='$LITHO_LCD_URL' GRPC_URL='$GRPC_URL' bash -s" \
            < Makalu/scripts/mainnet-validate.sh

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: api-build
        name: Build immutable staging API
        uses: docker/build-push-action@v6
        with:
          context: ./Makalu/api
          file: ./Makalu/api/Dockerfile
          push: true
          tags: ghcr.io/kajlabs/lithoscan-api:staging-sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            VERSION=staging-sha-${{ github.sha }}
          cache-from: type=gha,scope=lithoscan-mainnet-staging-api
          cache-to: type=gha,mode=max,scope=lithoscan-mainnet-staging-api

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/kajlabs/lithoscan-api
          subject-digest: ${{ steps.api-build.outputs.digest }}
          push-to-registry: true

      - id: explorer-build
        name: Build immutable mainnet-branded staging explorer
        uses: docker/build-push-action@v6
        with:
          context: ./Makalu/explorer
          file: ./Makalu/explorer/Dockerfile
          push: true
          tags: ghcr.io/kajlabs/lithoscan-explorer:staging-sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_NETWORK=mainnet
            NEXT_PUBLIC_CHAIN_ID=9005
            NEXT_PUBLIC_COSMOS_CHAIN_ID=lithosphere_9005-1
            NEXT_PUBLIC_CHAIN_NAME=Lithosphere Mainnet
            NEXT_PUBLIC_RPC_URL=
            NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3501
            NEXT_PUBLIC_EXPLORER_TITLE=Lithoscan
            NEXT_PUBLIC_DEFAULT_THEME=light
            NEXT_PUBLIC_BRIDGE_ENABLED=false
            NEXT_PUBLIC_SWAP_ROUTER=
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            VERSION=staging-sha-${{ github.sha }}
          cache-from: type=gha,scope=lithoscan-mainnet-staging-explorer
          cache-to: type=gha,mode=max,scope=lithoscan-mainnet-staging-explorer

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/kajlabs/lithoscan-explorer
          subject-digest: ${{ steps.explorer-build.outputs.digest }}
          push-to-registry: true

      - name: Prepare isolated staging UI package
        shell: bash
        run: |
          mkdir -p deploy-package/scripts
          cp Makalu/docker-compose.mainnet-staging-ui.yaml deploy-package/
          cp Makalu/scripts/mainnet-staging-ui-deploy.sh deploy-package/scripts/
          auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$auth_secret"
          umask 077
          cat > deploy-package/.env.ui <<EOF
          COMPOSE_PROJECT_NAME=lithoscan-mainnet-staging
          INDEXER_NETWORK_NAME=lithoscan-mainnet-staging_mainnet-internal
          API_IMAGE=ghcr.io/kajlabs/lithoscan-api
          API_IMAGE_TAG=staging-sha-$GITHUB_SHA
          EXPLORER_IMAGE=ghcr.io/kajlabs/lithoscan-explorer
          EXPLORER_IMAGE_TAG=staging-sha-$GITHUB_SHA
          API_PORT=4401
          EXPLORER_PORT=3501
          CHAIN_ID=lithosphere_9005-1
          LITHO_CHAIN_ID=9005
          LITHO_RPC_URL=$RPC_URL
          LITHO_LCD_URL=$LITHO_LCD_URL
          DATABASE_URL=postgresql://lithoscan_mainnet_staging:$POSTGRES_PASSWORD@postgres:5432/lithoscan_mainnet_staging?sslmode=disable
          REDIS_URL=redis://:$REDIS_PASSWORD@redis:6379
          AUTH_SESSION_SECRET=$auth_secret
          CORS_ORIGINS=http://127.0.0.1:3501,http://127.0.0.1:13501
          FAUCET_ENABLED=false
          BRIDGE_ENABLED=false
          MULTX_ENABLED=false
          SWAP_ENABLED=false
          GIT_SHA=$GITHUB_SHA
          VERSION=staging-sha-$GITHUB_SHA
          EOF

      - name: Deploy loopback-only staging API and explorer
        shell: bash
        run: |
          target="$DEPLOY_USER@$DEPLOY_HOST"
          deploy_path=/opt/lithoscan-mainnet-staging/ui
          remote_docker_config="/tmp/lithoscan-ghcr-$GITHUB_RUN_ID"
          cleanup_remote() {
            ssh "$target" "rm -rf '$remote_docker_config'" || true
          }
          trap cleanup_remote EXIT
          ssh "$target" "mkdir -p '$deploy_path' '$remote_docker_config' && test -w '$deploy_path'"
          printf '%s' "$GHCR_TOKEN" | ssh "$target" "docker --config '$remote_docker_config' login ghcr.io --username '$GHCR_USER' --password-stdin"
          scp -r deploy-package/. "$target:$deploy_path/"
          ssh "$target" "chmod 600 '$deploy_path/.env.ui'; chmod 700 '$deploy_path/scripts/mainnet-staging-ui-deploy.sh'; DOCKER_CONFIG='$remote_docker_config' DEPLOY_DIR='$deploy_path' bash '$deploy_path/scripts/mainnet-staging-ui-deploy.sh'"

      - name: Run smoke tests through private SSH tunnel
        shell: bash
        run: |
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -N -o ExitOnForwardFailure=yes -L 13501:127.0.0.1:3501 "$target" &
          tunnel_pid=$!
          trap 'kill "$tunnel_pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            curl --fail --silent --max-time 5 http://127.0.0.1:13501/ >/dev/null && break
            [[ "$attempt" == "15" ]] && { echo "SSH staging tunnel did not become ready"; exit 1; }
            sleep 2
          done
          BASE_URL=http://127.0.0.1:13501 MAX_INDEXER_LAG="$MAX_INDEXER_LAG" bash Makalu/scripts/mainnet-smoke-test.sh
          BASE_URL=http://127.0.0.1:13501 bash Makalu/scripts/mainnet-client-fixes-smoke.sh

      - name: Staging evidence summary
        run: |
          echo "## Lithoscan mainnet staging smoke passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Network: EVM 9005 / Cosmos lithosphere_9005-1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Access: private SSH tunnel; no DNS change" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing mainnet indexer/database: reused, not recreated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bridge, Swap, Faucet and MultX: disabled" >> "$GITHUB_STEP_SUMMARY"
