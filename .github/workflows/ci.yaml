# Lithosphere CI — Quality Gate Pipeline
# Parallel jobs: build, lint, test, typecheck, gitleaks

name: CI

on:
  # Pushes to main stay path-filtered: it's a pure optimization and does not
  # affect merge gating.
  push:
    branches:
      - main
    paths:
      - 'Makalu/**'
      - '.github/workflows/ci.yaml'

  # Pull requests are deliberately NOT path-filtered. Six of this workflow's
  # jobs — Test, Typecheck, License Check, Schema Sync Check, OpenAPI Sync
  # Check and OpenAPI SDK Codegen Check — are required status checks on main.
  # A filtered trigger meant a docs-only or .github-only PR never ran them, so
  # those contexts were never reported and branch protection blocked the PR
  # permanently, with an admin override as the only way through.
  #
  # The cost is that a docs-only PR now runs the full Makalu quality gate.
  # That's deliberate: correctness of the merge gate over a few CI minutes.
  # If this becomes a bottleneck, the fix is change detection with jobs that
  # still always report their check name (see ci-abi-gate.yaml) — NOT
  # re-adding a paths filter here.
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt every JavaScript-based action into Node.js 24 ahead of the
  # 2026-06-02 forced migration (annotations on every run today).
  # One-line revert if any action breaks.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Secret Scanning (runs in parallel, no dependencies)
  # ─────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gitleaks git --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            gitleaks git --redact --no-banner .
          fi

  # ─────────────────────────────────────────────────────────────────────
  # Install + Build (required by test and typecheck)
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: Makalu/**/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-modules-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Makalu/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Turbo)
        run: pnpm turbo run build --filter='...[origin/main]'

      - name: Upload Turbo Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-build-summary
          path: Makalu/.turbo/runs
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # Lint (parallel with build — no build dependency needed)
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Turbo)
        run: pnpm turbo run lint --filter='...[origin/main]'

  # ─────────────────────────────────────────────────────────────────────
  # Test (after build — tests may require compiled output)
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Makalu/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (Turbo) with coverage
        # `continue-on-error: true` is intentional — it's the quarantine
        # plumbing, NOT an "advisory" label. The downstream
        # `Process test results against quarantine` step
        # (scripts/process-test-results.mjs, no continue-on-error) splits
        # vitest failures into real-vs-quarantined via .test-quarantine.yaml
        # and exits 1 on real failures, gating the job. Without this flag
        # here, a quarantined flake would still fail the job at this step,
        # bypassing the processor's classification.
        continue-on-error: true
        run: pnpm turbo run test:coverage --filter='...[origin/main]' --continue
        env:
          CI: true

      # Explorer is a sibling Next.js project, not a workspace member (it has
      # its own lockfile + node_modules). Run its tests directly. Same
      # quarantine plumbing as the Test step above: `continue-on-error: true`
      # routes failures through the processor for real-vs-quarantined
      # classification, not advisory bypass.
      - name: Explorer tests with coverage
        continue-on-error: true
        working-directory: ./Makalu/explorer
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            pnpm --ignore-workspace install --frozen-lockfile
            pnpm --ignore-workspace test:coverage
          else
            echo "explorer has no test script, skipping"
          fi

      # ── Build a combined Test + Coverage summary ──────────────────────────
      # Output goes to two places: $GITHUB_STEP_SUMMARY (visible on every run)
      # and /tmp/pr-summary.md (consumed by the PR-comment step below). One
      # source of truth → both surfaces stay in sync.
      - name: Build Test + Coverage Summary
        if: always()
        id: build-summary
        run: |
          SUMMARY=/tmp/pr-summary.md
          : > "$SUMMARY"

          echo "## Test Results" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| Package  | Passed | Failed | Skipped | Total | Duration |" >> "$SUMMARY"
          echo "|----------|-------:|-------:|--------:|------:|---------:|" >> "$SUMMARY"
          for pkg in api indexer explorer; do
            results="$pkg/test-results.json"
            if [ -f "$results" ]; then
              passed=$(jq -r '.numPassedTests' "$results")
              failed=$(jq -r '.numFailedTests' "$results")
              skipped=$(jq -r '.numPendingTests' "$results")
              total=$(jq -r '.numTotalTests' "$results")
              # JSON reports startTime/endTime in ms epoch — compute duration in seconds.
              duration_ms=$(jq -r '(.endTime // 0) - (.startTime // 0)' "$results")
              duration=$(awk -v ms="$duration_ms" 'BEGIN { printf "%.1fs", ms/1000 }')
              echo "| $pkg | $passed | $failed | $skipped | $total | $duration |" >> "$SUMMARY"
            else
              echo "| $pkg | _no results_ | | | | |" >> "$SUMMARY"
            fi
          done

          echo "" >> "$SUMMARY"
          echo "## Coverage" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "| Package  | Stmts % | Branch % | Funcs % | Lines % |" >> "$SUMMARY"
          echo "|----------|--------:|---------:|--------:|--------:|" >> "$SUMMARY"
          for pkg in api indexer explorer; do
            cov="$pkg/coverage/coverage-summary.json"
            if [ -f "$cov" ]; then
              stmts=$(jq -r '.total.statements.pct' "$cov")
              branch=$(jq -r '.total.branches.pct' "$cov")
              funcs=$(jq -r '.total.functions.pct' "$cov")
              lines=$(jq -r '.total.lines.pct' "$cov")
              echo "| $pkg | $stmts | $branch | $funcs | $lines |" >> "$SUMMARY"
            else
              echo "| $pkg | _no coverage_ | | | |" >> "$SUMMARY"
            fi
          done

          echo "" >> "$SUMMARY"
          echo "<sub>Generated by [\`ci.yaml\`](../actions/runs/${{ github.run_id }}) for \`${{ github.sha }}\`. Test JSON + coverage HTML are uploaded as run artifacts.</sub>" >> "$SUMMARY"

          # Also write into the GitHub Actions step summary so the run page shows it.
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      # ── Quarantine post-processor ─────────────────────────────────────────
      # Splits vitest failures into "real" vs "quarantined" (entries in
      # .test-quarantine.yaml). Real failures exit non-zero; quarantined ones
      # are surfaced as warnings + appended to /tmp/pr-summary.md so reviewers
      # see the noise without it blocking the PR. Stale entries (>30d) emit
      # ::warning:: annotations as a reminder to fix-or-retire.
      - name: Process test results against quarantine
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/process-test-results.mjs

      # ── Post / update sticky PR comment ──────────────────────────────────
      # Only on pull_request triggers. Replaces the prior comment instead of
      # spamming a new one each push, so the PR conversation stays readable.
      # Runs AFTER the quarantine processor so the "Quarantined Failures"
      # subtable is included in the same sticky comment.
      - name: Post PR Comment
        # Fork pull_request tokens are read-only. The same report remains on
        # the run summary; only same-repository PRs receive a sticky comment.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-test-summary
          path: /tmp/pr-summary.md

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            Makalu/api/coverage/
            Makalu/indexer/coverage/
            Makalu/explorer/coverage/
          retention-days: 14
          if-no-files-found: ignore

      # Upload vitest JSON for the flake tracker. scripts/flake-tracker.sh
      # consumes these across the last N runs to find tests with mixed pass/fail.
      - name: Upload test-results JSON (for flake tracker)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            Makalu/api/test-results.json
            Makalu/indexer/test-results.json
            Makalu/explorer/test-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # Typecheck (after build — needs compiled dependencies)
  # ─────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: Makalu/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (Turbo)
        # Promoted from advisory to blocking 2026-05-12. Typecheck has been
        # green across every recent run in the visible history; flipping
        # to a real gate prevents type-error regressions from landing on
        # main with a green checkmark. Compile-time errors should never
        # have been a soft signal — strict TS is the contract.
        run: pnpm turbo run typecheck --filter='...[origin/main]'

  # ─────────────────────────────────────────────────────────────────────
  # License Check — enforces .license-policy.yaml against the prod
  # dependency tree. Catches copyleft/source-available licenses being
  # pulled in transitively before they ship in the SDK.
  # ─────────────────────────────────────────────────────────────────────
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('Makalu/**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        working-directory: ./Makalu
        run: pnpm install --frozen-lockfile

      - name: Run license policy check
        run: node scripts/check-licenses.mjs

  # ─────────────────────────────────────────────────────────────────────
  # GraphQL Schema Drift Gate — fail if docs/api-reference/schema.graphql
  # doesn't match what re-printing src/schema.ts produces. Prevents
  # shipping an api whose machine-readable schema is silently stale.
  # ─────────────────────────────────────────────────────────────────────
  schema-sync-check:
    name: Schema Sync Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: ./Makalu
        run: pnpm install --frozen-lockfile

      - name: Verify GraphQL schema is in sync
        run: pnpm run verify-schema-in-sync

  # ─────────────────────────────────────────────────────────────────────
  # OpenAPI Route Drift Gate — fail if docs/api-reference/openapi.yaml
  # doesn't list every route registered in src/{routes,litho}.ts and
  # vice versa. Schema content (response bodies, params) is intentionally
  # NOT gated — only the route SET is checked. Same drift-gate pattern
  # as the GraphQL schema and contract-ABI sync jobs.
  # ─────────────────────────────────────────────────────────────────────
  openapi-sync-check:
    name: OpenAPI Sync Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu/api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: ./Makalu
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI route set is in sync
        run: pnpm run verify-openapi-in-sync

  openapi-codegen-check:
    name: OpenAPI SDK Codegen Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./Makalu/packages/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Makalu/pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: ./Makalu
        run: pnpm install --frozen-lockfile

      # Regenerate src/generated/openapi.ts from docs/api-reference/openapi.yaml
      # and fail if `git diff` reports a change. Symmetric with openapi-sync-check
      # (which guards the producer side): the route set is auto-introspected
      # from the running Express routers; this gate guards the consumer side
      # — "if the YAML changed, the generated SDK types must be regenerated."
      - name: Verify SDK OpenAPI codegen is in sync
        run: pnpm run verify-openapi-codegen
