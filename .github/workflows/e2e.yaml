# E2E smoke tests — Playwright against makalu.litho.ai (or any URL via input)
#
# Runs nightly and on workflow_dispatch. Not gating any merge yet — surfaces
# regressions in the deployed explorer (homepage, search, blocks list).

name: E2E Smoke

on:
  schedule:
    # Daily at 03:00 UTC (after typical maintenance windows)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override base URL (default https://makalu.litho.ai)'
        required: false
        default: 'https://makalu.litho.ai'

permissions:
  contents: read

env:
  # Opt every JavaScript-based action into Node.js 24 ahead of the
  # 2026-06-02 forced migration (annotations on every run today).
  # One-line revert if any action breaks.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./e2e
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://makalu.litho.ai' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm install:browsers

      - name: Run smoke tests
        run: pnpm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results JSON (flake tracker input)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-${{ github.run_id }}
          path: e2e/test-results.json
          retention-days: 30
          if-no-files-found: ignore
