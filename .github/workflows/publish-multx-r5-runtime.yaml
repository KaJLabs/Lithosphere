name: Publish reviewed MultX R5 runtime images

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact independently reviewed R5 source commit
        required: true
        default: c46878a2c36c419e6e5176d7ad1fbcd845a87ea9
      confirmation:
        description: Type PUBLISH_REVIEWED_R5_RUNTIME to publish images only
        required: true
  pull_request:
    paths:
      - .github/workflows/publish-multx-r5-runtime.yaml
      - .github/docker/multx-r5-api.Dockerfile
      - .github/docker/multx-r5-signer.Dockerfile

permissions:
  contents: read

concurrency:
  group: multx-r5-runtime-image-publish
  cancel-in-progress: false

env:
  ACCEPTED_COMMIT: c46878a2c36c419e6e5176d7ad1fbcd845a87ea9
  API_IMAGE: ghcr.io/kajlabs/lithosphere/multx-api
  SIGNER_IMAGE: ghcr.io/kajlabs/lithosphere/multx-signer

jobs:
  validate:
    name: Validate exact reviewed source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce publication boundary
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = 'refs/heads/main'
          test "$REQUESTED_COMMIT" = "$ACCEPTED_COMMIT"
          test "$CONFIRMATION" = 'PUBLISH_REVIEWED_R5_RUNTIME'

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTED_COMMIT }}
          fetch-depth: 1

      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify API
        working-directory: MultX/api
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=moderate
          npm test

      - name: Verify signer
        working-directory: MultX/signer
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high
          npm test

      - name: Check load-bearing API and signer controls
        run: |
          set -euo pipefail
          node MultX/scripts/check-closure-mutations.cjs api
          node MultX/scripts/check-closure-mutations.cjs signer

  scan-packaging:
    name: Scan hardened API and signer packaging
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out publication controls
        uses: actions/checkout@v4
        with:
          path: publication-control

      - name: Check out exact accepted source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTED_COMMIT }}
          path: accepted-source

      - name: Verify source identity
        working-directory: accepted-source
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_COMMIT"

      - uses: docker/setup-buildx-action@v3

      - name: Build API candidate
        uses: docker/build-push-action@v6
        with:
          context: accepted-source/MultX/api
          file: publication-control/.github/docker/multx-r5-api.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: multx-r5-api:scan

      - name: Verify API source manifest
        run: docker run --rm --entrypoint node multx-r5-api:scan /usr/local/lib/verify-runtime-source.mjs

      - name: Scan API candidate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: multx-r5-api:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Build signer candidate
        uses: docker/build-push-action@v6
        with:
          context: accepted-source/MultX/signer
          file: publication-control/.github/docker/multx-r5-signer.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: multx-r5-signer:scan

      - name: Scan signer candidate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: multx-r5-signer:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

  publish:
    name: Scan, publish, sign and attest immutable images
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: multx-image-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out publication controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publication-control

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTED_COMMIT }}
          fetch-depth: 0
          path: accepted-source

      - name: Verify source identity
        working-directory: accepted-source
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_COMMIT"

      - name: Require accepted source to be merged into main
        working-directory: accepted-source
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          git merge-base --is-ancestor "$ACCEPTED_COMMIT" FETCH_HEAD

      - uses: docker/setup-buildx-action@v3

      - name: Build pinned API image locally
        uses: docker/build-push-action@v6
        with:
          context: accepted-source/MultX/api
          file: publication-control/.github/docker/multx-r5-api.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.API_IMAGE }}:r5-${{ env.ACCEPTED_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/KaJLabs/Lithosphere
            org.opencontainers.image.revision=${{ env.ACCEPTED_COMMIT }}
            org.opencontainers.image.version=multx-r5

      - name: Build pinned signer image locally
        uses: docker/build-push-action@v6
        with:
          context: accepted-source/MultX/signer
          file: publication-control/.github/docker/multx-r5-signer.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SIGNER_IMAGE }}:r5-${{ env.ACCEPTED_COMMIT }}
          labels: |
            org.opencontainers.image.source=https://github.com/KaJLabs/Lithosphere
            org.opencontainers.image.revision=${{ env.ACCEPTED_COMMIT }}
            org.opencontainers.image.version=multx-r5

      - name: Verify built-image source identity
        run: |
          set -euo pipefail
          api_tag="${API_IMAGE}:r5-${ACCEPTED_COMMIT}"
          signer_tag="${SIGNER_IMAGE}:r5-${ACCEPTED_COMMIT}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$api_tag")" = "$ACCEPTED_COMMIT"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$signer_tag")" = "$ACCEPTED_COMMIT"
          docker run --rm --entrypoint node "$api_tag" /usr/local/lib/verify-runtime-source.mjs

      - name: Scan API image before publication
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.API_IMAGE }}:r5-${{ env.ACCEPTED_COMMIT }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Scan signer image before publication
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.SIGNER_IMAGE }}:r5-${{ env.ACCEPTED_COMMIT }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Log in to GHCR only after validation and scans pass
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and capture registry digests
        id: images
        run: |
          set -euo pipefail
          api_tag="${API_IMAGE}:r5-${ACCEPTED_COMMIT}"
          signer_tag="${SIGNER_IMAGE}:r5-${ACCEPTED_COMMIT}"
          docker push "$api_tag"
          docker push "$signer_tag"
          api_digest="$(docker buildx imagetools inspect "$api_tag" | awk '/^Digest:/ {print $2; exit}')"
          signer_digest="$(docker buildx imagetools inspect "$signer_tag" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$signer_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "api_digest=$api_digest" >> "$GITHUB_OUTPUT"
          echo "signer_digest=$signer_digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Sign both immutable digests
        env:
          API_DIGEST: ${{ steps.images.outputs.api_digest }}
          SIGNER_DIGEST: ${{ steps.images.outputs.signer_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$API_IMAGE@$API_DIGEST"
          cosign sign --yes "$SIGNER_IMAGE@$SIGNER_DIGEST"

      - name: Attest API build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.images.outputs.api_digest }}
          push-to-registry: true

      - name: Attest signer build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.SIGNER_IMAGE }}
          subject-digest: ${{ steps.images.outputs.signer_digest }}
          push-to-registry: true

      - name: Verify signatures and provenance
        env:
          API_DIGEST: ${{ steps.images.outputs.api_digest }}
          SIGNER_DIGEST: ${{ steps.images.outputs.signer_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for image in "$API_IMAGE@$API_DIGEST" "$SIGNER_IMAGE@$SIGNER_DIGEST"; do
            cosign verify "$image" \
              --certificate-identity-regexp '^https://github.com/KaJLabs/Lithosphere/.github/workflows/publish-multx-r5-runtime.yaml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            gh attestation verify "oci://$image" --repo KaJLabs/Lithosphere
          done

      - name: Record immutable outputs
        env:
          API_DIGEST: ${{ steps.images.outputs.api_digest }}
          SIGNER_DIGEST: ${{ steps.images.outputs.signer_digest }}
        run: |
          {
            echo '## Reviewed MultX R5 runtime images'
            echo
            echo "- Reviewed source commit: \`$ACCEPTED_COMMIT\`"
            echo "- API image: \`$API_IMAGE@$API_DIGEST\`"
            echo "- Signer image: \`$SIGNER_IMAGE@$SIGNER_DIGEST\`"
            echo '- Deployment performed: `false`'
            echo '- Signing, relaying and Swap enabled: `false`'
            echo '- Canary or activation authorized: `false`'
          } >> "$GITHUB_STEP_SUMMARY"
